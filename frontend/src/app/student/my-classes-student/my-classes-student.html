<div class="my-classes-container">
  <header class="page-header">
    <div>
      <h2><i class="fas fa-graduation-cap"></i> Cursurile mele</h2>
      <p class="subtitle">Vizualizează cursurile la care ești înscris</p>
    </div>
  </header>
  
  <div *ngIf="loading()">Se încarcă cursurile...</div>
  <div class="error" *ngIf="error()">{{ error() }}</div>

  <div *ngIf="!loading() && courses().length === 0">
    Nu ești înscris la niciun curs.
  </div>

  <div class="courses-grid" *ngIf="courses().length > 0">
    <div class="course-card" *ngFor="let course of courses()">
      <h3>{{ course.Title }}</h3>
      <p>{{ course.Description }}</p>
      <small>Creat la: {{ course.CreatedAt | date:'dd.MM.yyyy':undefined:'ro-RO' }}</small>
      <a [routerLink]="['/student/course', course.Id]" class="btn-view-course">Vezi cursul</a>
    </div>
  </div>
</div>
